name: API Drift Check

on:
  schedule:
    - cron: '0 3 * * *'   # nightly at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      # Public, self-contained build (bundled Postgres) of the latest relay release.
      RELAY_IMAGE: docker.io/wyolet/relay:standalone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # An unreachable relay fails the run: a skipped check must never read as green.
      - name: Start Relay container
        run: |
          docker run -d --name relay -p 8081:8081 "$RELAY_IMAGE"
          # Control plane on :8081; the OpenAPI spec lives under its /api mount
          # (:8080 is the data plane and serves the wrong spec).
          for i in $(seq 1 90); do
            curl -sf http://localhost:8081/api/openapi.json > /dev/null && exit 0
            sleep 1
          done
          docker logs relay | tail -50
          echo "::error::$RELAY_IMAGE control API did not come up"
          exit 1

      - name: Regenerate types
        run: make gen RELAY_URL=http://localhost:8081/api

      - name: Fail on drift
        run: |
          if ! git diff --exit-code src/api/types.gen.ts; then
            echo "::error::API type drift against $RELAY_IMAGE — run 'make gen' against that release and commit, or release relay."
            exit 1
          fi
          echo "No drift detected."
