name: OSV-Scanner

# PRs fail only on vulnerabilities they introduce; the scheduled scan catches
# new advisories against the existing lockfile.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      actions: read
      contents: read
      security-events: write

  scan:
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: false
    permissions:
      actions: read
      contents: read
      security-events: write
