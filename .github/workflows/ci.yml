name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Bundle size check (warn-only, hardens in PER-281)
        run: |
          BUDGET_KB=500
          TOTAL_GZ=$(find dist/assets -name '*.js' -o -name '*.css' | xargs gzip -c | wc -c)
          TOTAL_KB=$((TOTAL_GZ / 1024))
          echo "Gzipped bundle size: ${TOTAL_KB} KB (budget: ${BUDGET_KB} KB)"
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "::warning::Bundle size ${TOTAL_KB}KB exceeds ${BUDGET_KB}KB budget. This will become a hard failure in PER-281."
          else
            echo "Bundle size OK: ${TOTAL_KB}KB < ${BUDGET_KB}KB"
          fi
