name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Bundle size check (warn-only sanity ceiling)
        run: |
          # Loose guardrail so the bundle can't balloon unnoticed. This is an
          # operator UI embedded in the relay binary (LAN/localhost, cached) —
          # not a public SPA, so the budget is generous on purpose.
          BUDGET_KB=1024
          TOTAL_GZ=$(find dist/assets -name '*.js' -o -name '*.css' | xargs gzip -c | wc -c)
          TOTAL_KB=$((TOTAL_GZ / 1024))
          echo "Gzipped bundle size: ${TOTAL_KB} KB (budget: ${BUDGET_KB} KB)"
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "::warning::Bundle size ${TOTAL_KB}KB exceeds ${BUDGET_KB}KB budget — consider code-splitting."
          else
            echo "Bundle size OK: ${TOTAL_KB}KB < ${BUDGET_KB}KB"
          fi

  # Gates only what ships in the bundle; dev tooling advisories surface via OSV.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Audit runtime dependencies
        run: bun audit --prod --audit-level=high
